<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F07C00;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D9E75;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0F6E56;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: sun rising over solar panel -->
  <g transform="translate(10,10)">
    <!-- Sun circle -->
    <circle cx="30" cy="22" r="12" fill="url(#sunGrad)"/>
    <!-- Sun rays -->
    <g stroke="#F5A623" stroke-width="2.5" stroke-linecap="round">
      <line x1="30" y1="4"  x2="30" y2="1"/>
      <line x1="30" y1="40" x2="30" y2="43"/>
      <line x1="12" y1="22" x2="9"  y2="22"/>
      <line x1="48" y1="22" x2="51" y2="22"/>
      <line x1="17" y1="9"  x2="14" y2="6"/>
      <line x1="43" y1="35" x2="46" y2="38"/>
      <line x1="43" y1="9"  x2="46" y2="6"/>
      <line x1="17" y1="35" x2="14" y2="38"/>
    </g>
    <!-- Solar panel base -->
    <rect x="4" y="44" width="52" height="16" rx="3" fill="url(#leafGrad)"/>
    <!-- Panel grid lines -->
    <g stroke="rgba(255,255,255,0.3)" stroke-width="0.8">
      <line x1="21.3" y1="44" x2="21.3" y2="60"/>
      <line x1="38.6" y1="44" x2="38.6" y2="60"/>
      <line x1="4" y1="52" x2="56" y2="52"/>
    </g>
    <!-- Panel reflection highlight -->
    <rect x="5" y="45" width="50" height="3" rx="1" fill="rgba(255,255,255,0.12)"/>
  </g>

  <!-- Wordmark -->
  <text x="84" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#191B17">Solar</text>
  <text x="84" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#191B17">
    <tspan dx="58">Sense</tspan>
  </text>
  <!-- Green underline accent on "Sense" -->
  <rect x="142" y="40" width="60" height="3" rx="1.5" fill="#1D9E75"/>

  <!-- Tagline -->
  <text x="84" y="57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="500" letter-spacing="0.3" fill="#8B8F86">INDIA</text>
  <text x="84" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#8B8F86" letter-spacing="0.2">Free solar calculator for Indian homes</text>
</svg>
